name: ogm-gonullu-dev

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: ogm-gonullu-api:dev
    container_name: ogm-backend-dev
    env_file: .env
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    ports:
      - "3001:3000"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./seeds:/app/seeds
      - ./knexfile.js:/app/knexfile.js
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ogm-net

  mysql:
    image: mysql:8.0
    container_name: ogm-mysql-dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD eksik}
      MYSQL_DATABASE: ${DB_NAME:-ogm_gonullu}
      MYSQL_USER: ${DB_USER:-ogm_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD eksik}
    volumes:
      - mysql-dev-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ogm-net

  redis:
    image: redis:7-alpine
    container_name: ogm-redis-dev
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD eksik}", "--appendonly", "yes"]
    volumes:
      - redis-dev-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ogm-net

volumes:
  mysql-dev-data:
  redis-dev-data:

networks:
  ogm-net:
    driver: bridge
