name: ogm-gonullu

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: ogm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ogm-net

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ogm-gonullu-api:latest
    container_name: ogm-backend
    env_file: .env
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ogm-net

  mysql:
    image: mysql:8.0
    container_name: ogm-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD eksik}
      MYSQL_DATABASE: ${DB_NAME:-ogm_gonullu}
      MYSQL_USER: ${DB_USER:-ogm_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD eksik}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backups/mysql:/backups
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ogm-net

  redis:
    image: redis:7-alpine
    container_name: ogm-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD eksik}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ogm-net

volumes:
  mysql-data:
  redis-data:

networks:
  ogm-net:
    driver: bridge
