user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 25m;
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;

    upstream backend {
        least_conn;
        server backend:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # ── HTTP: ACME challenge serve + HTTPS redirect ─────────────────────
    server {
        listen 80;
        server_name recepbiyikli.com;

        # Let's Encrypt HTTP-01 challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Diğer her şey HTTPS'e
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS: gerçek proxy ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name recepbiyikli.com;

        ssl_certificate     /etc/letsencrypt/live/recepbiyikli.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/recepbiyikli.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Admin paneli (statik SPA) ────────────────────────────────────
        # Kaynak: ogm-gonullu-panel repo'su, Vite base "/panel/" ile build edilir
        # ve scripts/deploy.sh ile ./frontend/panel altına rsync'lenir.
        # Bu dizin deploy.sh'ın rsync-exclude listesinde — BE deploy'u panel
        # build'ini silmemeli.
        location /panel/ {
            alias /usr/share/nginx/panel/;
            # SPA fallback: client-side route'lar index.html'e düşer
            try_files $uri $uri/ /panel/index.html;
        }

        location = /panel {
            return 301 /panel/;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
