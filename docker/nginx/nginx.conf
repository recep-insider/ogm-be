user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 25m;
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;

    upstream backend {
        least_conn;
        server backend:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        # SSL terminasyonu üretim ortamında 443 üzerinde yapılır.
        # Geliştirme ortamında HTTP üzerinden proxy çalışır.

        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /v1/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            return 200 'OGM Gönüllü API çalışıyor. /health endpointini deneyin.\n';
            add_header Content-Type text/plain;
        }
    }
}
